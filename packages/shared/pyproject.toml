[project]
name = "medikiosk-shared"
version = "0.1.0"
description = "Shared Pydantic models, session store protocol, FHIR types"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "fhir.resources>=7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medikiosk_shared"]
