[project]
name = "medikiosk-dialogue"
version = "0.1.0"
description = "Conversational history engine: ontology state machine + LLM slot-filler"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "medikiosk-shared",
    "medikiosk-ontology",
]

[tool.uv.sources]
medikiosk-shared = { workspace = true }
medikiosk-ontology = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medikiosk_dialogue"]