[project]
name = "medikiosk-docintel"
version = "0.1.0"
description = "Document intelligence: classify, date-extract, abnormal-flag, interactions, timeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "medikiosk-shared",
    "medikiosk-ner",
]

[tool.uv.sources]
medikiosk-shared = { workspace = true }
medikiosk-ner = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medikiosk_docintel"]