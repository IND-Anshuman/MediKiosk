[project]
name = "medikiosk-api"
version = "0.1.0"
description = "MediKiosk API gateway: sessions, consent, documents, triage"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "medikiosk-shared",
    "medikiosk-ontology",
]

[tool.uv.sources]
medikiosk-shared = { workspace = true }
medikiosk-ontology = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medikiosk_api"]
