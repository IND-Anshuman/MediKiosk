[project]
name = "medikiosk-tts"
version = "0.1.0"
description = "TTS service: build-time pre-baked question audio + runtime edge-tts fallback"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "edge-tts>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medikiosk_tts"]