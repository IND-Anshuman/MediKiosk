[project]
name = "medikiosk-summarizer"
version = "0.1.0"
description = "Deterministic Jinja clinical summary with slot citations + PDF render"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "markdown2>=2.4",
    "fpdf2>=2.7",
    "pydantic>=2.7",
    "medikiosk-shared",
]

[tool.uv.sources]
medikiosk-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medikiosk_summarizer"]