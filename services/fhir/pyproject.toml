[project]
name = "medikiosk-fhir"
version = "0.1.0"
description = "FHIR R4 bundle builder + ABHA adapter + HIS push/outbox"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "fhir.resources>=8.3.0",
    "httpx>=0.27",
    "medikiosk-shared",
]

[tool.uv.sources]
medikiosk-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medikiosk_fhir"]