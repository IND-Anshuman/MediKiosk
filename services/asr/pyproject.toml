[project]
name = "medikiosk-asr"
version = "0.1.0"
description = "Utterance-level ASR service (faster-whisper, CPU int8)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "faster-whisper>=1.0",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medikiosk_asr"]