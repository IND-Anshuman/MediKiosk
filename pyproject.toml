[project]
name = "medikiosk"
version = "0.1.0"
description = "AI-powered clinical history intake platform (SIH MVP)"
requires-python = ">=3.11"
dependencies = [
    "edge-tts>=7.2.8",
    "faster-whisper>=1.2.1",
    "fhir-resources>=8.3.0",
    "rq>=2.12.0",
    "sqlalchemy>=2.0.52",
    "medikiosk-shared",
    "medikiosk-ontology",
    "medikiosk-api",
    "medikiosk-asr",
    "python-multipart>=0.0.32",
]

[tool.uv.sources]
medikiosk-shared = { workspace = true }
medikiosk-ontology = { workspace = true }
medikiosk-api = { workspace = true }
medikiosk-asr = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.21",
    "httpx>=0.27",
]

# Workspace members are the shared packages + backend services.
# Frontend (apps/web) is pnpm-managed; see package.json.
[tool.uv.workspace]
members = [
    "packages/shared",
    "packages/ontology",
    "services/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
