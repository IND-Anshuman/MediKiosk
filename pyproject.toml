[project]
name = "medikiosk"
version = "0.1.0"
description = "AI-powered clinical history intake platform (SIH MVP)"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.21",
    "httpx>=0.27",
]

# Workspace members are the shared packages + backend services.
# Frontend (apps/web) is pnpm-managed; see package.json.
[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
